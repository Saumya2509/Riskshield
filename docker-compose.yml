version: '3.8'

services:
  riskshield-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riskshield-platform
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
